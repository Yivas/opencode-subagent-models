name: Bug report
description: Report reproducible behavior that differs from the documentation.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include tokens, prompts, session contents, or private configuration. Report security problems through the private security form.
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 0.2.1
    validations:
      required: true
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add sanitized logs or configuration only when they help reproduce the problem.
